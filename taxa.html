<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator taxă în funcție de suprafață</title>
    <!-- Favicons -->
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/favicon.png">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f1; --surface:#ffffff; --text:#14262b; --muted:#5a6d72;
  --line:#cfdad8; --accent:#0d5c63; --accent-text:#ffffff; --hl:#d9efe9; --err:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1a1c; --surface:#172528; --text:#e6f0ee; --muted:#9db3b0;
    --line:#2b3f42; --accent:#5cc7bd; --accent-text:#08201f; --hl:#1f3a3b; --err:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1a1c; --surface:#172528; --text:#e6f0ee; --muted:#9db3b0;
  --line:#2b3f42; --accent:#5cc7bd; --accent-text:#08201f; --hl:#1f3a3b; --err:#ff8a80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:1.5rem;line-height:1.25;margin:0 0 6px}
p.sub{margin:0 0 22px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
label{display:block;font-weight:600;margin-bottom:8px}
.field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.field:focus-within{outline:3px solid var(--accent);outline-offset:1px}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);
  font:inherit;font-size:1.4rem;padding:12px 14px;outline:none}
.unit{display:flex;align-items:center;padding:0 16px;color:var(--muted);border-left:1px solid var(--line)}
.err{color:var(--err);min-height:1.5em;margin:8px 0 0;font-size:.95rem}
.result{margin-top:14px;padding:18px;border-radius:10px;background:var(--hl)}
.result .lbl{color:var(--muted);font-size:.95rem}
.result .val{font-size:2.4rem;font-weight:700;color:var(--accent);line-height:1.2;overflow-wrap:anywhere}
.result .det{margin-top:6px;color:var(--muted);font-size:.95rem}
h2{font-size:1.05rem;margin:28px 0 10px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{background:var(--bg);font-weight:600}
tr:last-child td{border-bottom:0}
tr.on td{background:var(--hl);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Calculator taxă în funcție de suprafață</h1>
  <p class="sub">Introdu suprafața și vezi taxa aplicabilă.</p>

  <div class="card">
    <label for="sup">Suprafața</label>
    <div class="field">
      <input id="sup" type="text" inputmode="decimal" autocomplete="off" placeholder="ex: 320">
      <span class="unit">m²</span>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="result" id="res" hidden>
      <div class="lbl">Taxa</div>
      <div class="val" id="val"></div>
      <div class="det" id="det"></div>
    </div>
  </div>

  <h2>Tarife</h2>
  <div class="tbl">
  <table>
    <thead><tr><th>Suprafață</th><th>Taxă</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
</main>

<script>
const TIERS=[
  {max:150, fee:7,  label:"până la 150 m², inclusiv"},
  {max:250, fee:8,  label:"151 – 250 m², inclusiv"},
  {max:500, fee:11, label:"251 – 500 m², inclusiv"},
  {max:750, fee:15, label:"501 – 750 m², inclusiv"},
  {max:1000,fee:19, label:"751 – 1000 m², inclusiv"},
  {max:Infinity, fee:22, label:"peste 1000 m²", extra:"22 lei + 0,01 lei/m² peste 1000 m²"}
];
const fmt=n=>n.toLocaleString("ro-RO",{minimumFractionDigits:2,maximumFractionDigits:2});

const rows=document.getElementById("rows");
TIERS.forEach((t,i)=>{
  const tr=document.createElement("tr");tr.id="t"+i;
  tr.innerHTML="<td>"+t.label+"</td><td>"+(t.extra||t.fee+" lei")+"</td>";
  rows.appendChild(tr);
});

const input=document.getElementById("sup"),err=document.getElementById("err"),
  res=document.getElementById("res"),val=document.getElementById("val"),det=document.getElementById("det");

function calc(){
  document.querySelectorAll("tr.on").forEach(r=>r.classList.remove("on"));
  const raw=input.value.trim().replace(/\s/g,"").replace(",",".");
  err.textContent="";res.hidden=true;
  if(raw==="")return;
  const s=Number(raw);
  if(!isFinite(s)||s<=0){err.textContent="Introdu un număr mai mare ca 0.";return;}
  const i=TIERS.findIndex(t=>s<=t.max);
  const t=TIERS[i];
  let fee=t.fee,detail="Treapta: "+t.label;
  if(i===TIERS.length-1){
    const over=s-1000;
    fee=22+0.01*over;
    detail="22 lei + 0,01 lei × "+over.toLocaleString("ro-RO",{maximumFractionDigits:2})+" m² peste 1000 m²";
  }
  val.textContent=fmt(fee)+" lei";
  det.textContent=detail;
  res.hidden=false;
  document.getElementById("t"+i).classList.add("on");
}
input.addEventListener("input",calc);
</script>
</body>
</html>
