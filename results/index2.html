  <style>
    .speedtest-widget {
      --st-primary: var(--primary-color, #002bff);
      --st-dl: var(--st-primary);
      --st-ul: #ff7a00;
      --st-ink: #1a1d21;
      --st-muted: #7d8590;
      --st-track: #e7eaed;
      --st-surface: #f2f4f6;
      font-family: "Inter Tight", sans-serif;
      color: var(--st-ink);
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 24px 22px;
      max-width: 780px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .speedtest-widget * { box-sizing: border-box; }
    .speedtest-widget .status { text-align: center; font-size: 13px; color: var(--st-muted); min-height: 18px; margin-bottom: 8px; }

    .speedtest-widget .test-hero { display: flex; gap: 32px; align-items: center; justify-content: center; flex-wrap: wrap; }

    /* vitezometru: două inele concentrice (download = exterior, upload = interior) */
    .speedtest-widget .gauge-col { position: relative; width: 290px; max-width: 100%; flex-shrink: 0; }
    .speedtest-widget .gauge-col svg { display: block; }
    .speedtest-widget .gauge-track { fill: none; stroke: var(--st-track); stroke-width: 16; stroke-linecap: round; }
    .speedtest-widget .gauge-progress { fill: none; stroke-width: 16; stroke-linecap: round; }
    .speedtest-widget .gauge-progress.dl { stroke: var(--st-dl); }
    .speedtest-widget .gauge-progress.ul { stroke: var(--st-ul); }
    .speedtest-widget .gauge-dot { fill: #ffffff; stroke-width: 4; }
    .speedtest-widget .gauge-dot.dl { stroke: var(--st-dl); }
    .speedtest-widget .gauge-dot.ul { stroke: var(--st-ul); }
    .speedtest-widget .gauge-tick-label { font-family: "Inter Tight", sans-serif; font-size: 12px; fill: var(--st-muted); text-anchor: middle; dominant-baseline: middle; }

    .speedtest-widget .gauge-readout { position: absolute; left: 0; right: 0; top: 58.8%; transform: translateY(-50%); text-align: center; pointer-events: none; }
    .speedtest-widget .ro-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .speedtest-widget .ro-row .arrow { font-size: 16px; font-weight: 700; }
    .speedtest-widget .ro-row.dl .arrow { color: var(--st-dl); }
    .speedtest-widget .ro-row.ul .arrow { color: var(--st-ul); }
    .speedtest-widget .ro-row .num { font-weight: 700; }
    .speedtest-widget .ro-unit { font-size: 12px; color: var(--st-muted); margin-top: 2px; }

    /* panouri download / upload / ping / jitter */
    .speedtest-widget .metrics-col { display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 390px; min-width: 260px; }
    .speedtest-widget .m-tile { background: var(--st-surface); border-radius: 10px; padding: 12px 16px; }
    .speedtest-widget .m-tile.m-pj { display: flex; justify-content: space-around; padding: 14px 16px; }
    .speedtest-widget .m-lab { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
    .speedtest-widget .m-lab i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--st-muted); }
    .speedtest-widget .m-lab.dl i { background: var(--st-dl); }
    .speedtest-widget .m-lab.ul i { background: var(--st-ul); }
    .speedtest-widget .m-val { font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .speedtest-widget .m-unit { font-size: 12px; color: var(--st-muted); }

    .speedtest-widget .actions { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 26px 0 0; }
    .speedtest-widget .actions button {
      display: inline-flex; align-items: center; gap: 8px; margin: 0;
      font-family: "Inter Tight", sans-serif; font-weight: 700; font-size: 15px;
      border: none; border-radius: 999px; padding: 13px 28px; cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    .speedtest-widget .actions button:hover { transform: translateY(-1px); }
    .speedtest-widget .actions button:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 3px; }
    .speedtest-widget button#go { color: #fff; background: var(--st-primary); }
    .speedtest-widget button#shareBtn { color: var(--st-ink); background: var(--st-surface); padding: 13px 22px; }
    .speedtest-widget button#shareBtn:hover { background: var(--st-track); }
    .speedtest-widget button#shareBtn svg { width: 20px; height: 20px; flex-shrink: 0; }

    @media (max-width: 640px) {
      .speedtest-widget .test-hero { flex-direction: column; }
      .speedtest-widget .metrics-col { width: 100%; max-width: none; flex-basis: auto; }
    }

  <script>
    (function () {
      const SITE = 'https://serv.ro';
      const $ = id => document.getElementById(id);

      /* ---------- parametrii din URL: dl, ul, ping, jitter ---------- */
      const q = new URLSearchParams(location.search);
      const read = k => {
        const v = q.get(k);
        return v !== null && v.trim() !== '' && Number.isFinite(Number(v)) && Number(v) >= 0 ? Number(v) : null;
      };
      const r = { dl: read('dl'), ul: read('ul'), ping: read('ping'), jitter: read('jitter') ?? 0 };
      const valid = r.dl !== null && r.ul !== null && r.ping !== null;

      const fmt = n => (Number.isInteger(n) ? String(n) : n.toFixed(1));

      $('go').addEventListener('click', () => { location.href = `${SITE}/?autostart=1`; });

      if (!valid) {
        $('status').textContent = 'Rezultat indisponibil. Rulează un test nou.';
        $('shareBtn').style.display = 'none';
        return;
      }

      /* ---------- valorile afișate ---------- */
      $('numDl').textContent = $('downVal').textContent = fmt(r.dl);
      $('numUl').textContent = $('upVal').textContent = fmt(r.ul);
      $('pingVal').textContent = fmt(r.ping);
      $('jitterVal').textContent = fmt(r.jitter);
      $('status').textContent = 'Rezultatul testului de viteză';

      /* ---------- meta, imagine de previzualizare și Schema.org, cu aceleași variabile din URL ---------- */
      const qs = new URLSearchParams({ dl: fmt(r.dl), ul: fmt(r.ul), ping: fmt(r.ping), jitter: fmt(r.jitter) }).toString();
      const pageUrl = `${SITE}/results/index.html?${qs}`;
      const imageUrl = `${SITE}/share/og-image?${qs}`;
      const title = `${fmt(r.dl)} Mbps descărcare / ${fmt(r.ul)} Mbps încărcare - Test viteză internet`;
      const desc = `Rezultat test viteză: ${fmt(r.dl)} Mbps descărcare, ${fmt(r.ul)} Mbps încărcare, ping ${fmt(r.ping)} ms, jitter ${fmt(r.jitter)} ms.`;

      const setAttr = (sel, attr, val) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
      document.title = title;
      setAttr('link[rel="canonical"]', 'href', pageUrl);
      setAttr('meta[name="description"]', 'content', desc);
      setAttr('meta[property="og:title"]', 'content', title);
      setAttr('meta[property="og:description"]', 'content', desc);
      setAttr('meta[property="og:url"]', 'content', pageUrl);
      setAttr('meta[property="og:image"]', 'content', imageUrl);
      setAttr('meta[name="twitter:title"]', 'content', title);
      setAttr('meta[name="twitter:description"]', 'content', desc);
      setAttr('meta[name="twitter:image"]', 'content', imageUrl);

      try {
        const schemaEl = $('schema');
        const schema = JSON.parse(schemaEl.textContent);
        for (const item of schema['@graph']) {
          if (item['@type'] === 'WebPage') { item.url = pageUrl; item.name = title; item.description = desc; item.image = imageUrl; }
        }
        schemaEl.textContent = JSON.stringify(schema);
      } catch (e) { /* păstrăm Schema.org implicit */ }

      /* ---------- vitezometru ---------- */
      const CX = 150, CY = 150, R_LABEL = 142, START_DEG = 225, SWEEP = 270;
      const TICKS = [0, 0.5, 1, 10, 100, 500, 1000];
      const TICK_LABELS = ['0', '0.5', '1', '10', '100', '500', '1000+'];
      const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const rings = {
        dl: { r: 118, cur: 0, target: 0, track: $('trackDl'), prog: $('progDl'), dot: $('dotDl') },
        ul: { r: 92,  cur: 0, target: 0, track: $('trackUl'), prog: $('progUl'), dot: $('dotUl') }
      };

      const polar = (deg, rad) => {
        const a = deg * Math.PI / 180;
        return { x: CX + rad * Math.cos(a), y: CY - rad * Math.sin(a) };
      };
      const arcPath = (d1, d2, rad) => {
        const p0 = polar(d1, rad), p1 = polar(d2, rad);
        return `M${p0.x.toFixed(1)},${p0.y.toFixed(1)} A${rad},${rad} 0 ${Math.abs(d1 - d2) > 180 ? 1 : 0} 1 ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
      };
      // viteză (Mbps) -> poziție pe cadran, 0..1
      const fractionFor = v => {
        if (!(v > 0)) return 0;
        const last = TICKS.length - 1;
        if (v >= TICKS[last]) return 1;
        for (let i = 0; i < last; i++) {
          if (v < TICKS[i + 1]) return (i + (v - TICKS[i]) / (TICKS[i + 1] - TICKS[i])) / last;
        }
        return 1;
      };
      const drawRing = k => {
        const g = rings[k];
        const deg = START_DEG - g.cur * SWEEP;
        g.prog.setAttribute('d', g.cur > 0.002 ? arcPath(START_DEG, deg, g.r) : '');
        const p = polar(deg, g.r);
        g.dot.setAttribute('cx', p.x.toFixed(1));
        g.dot.setAttribute('cy', p.y.toFixed(1));
      };

      const ticks = $('gaugeTicks');
      TICK_LABELS.forEach((label, i) => {
        const p = polar(START_DEG - i * (SWEEP / (TICKS.length - 1)), R_LABEL);
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        el.setAttribute('x', p.x.toFixed(1));
        el.setAttribute('y', p.y.toFixed(1));
        el.setAttribute('class', 'gauge-tick-label');
        el.textContent = label;
        ticks.appendChild(el);
      });

      for (const k in rings) {
        rings[k].track.setAttribute('d', arcPath(START_DEG, START_DEG - SWEEP, rings[k].r));
        rings[k].target = fractionFor(r[k]);
        if (REDUCE_MOTION) rings[k].cur = rings[k].target;
        drawRing(k);
      }

      // animație lină: punctele alunecă de la 0 la valoarea rezultatului
      function animate() {
        let moving = false;
        for (const k in rings) {
          const g = rings[k], diff = g.target - g.cur;
          if (Math.abs(diff) > 0.0005) { g.cur += diff * 0.08; moving = true; } else { g.cur = g.target; }
          drawRing(k);
        }
        if (moving) requestAnimationFrame(animate);
      }
      if (!REDUCE_MOTION) requestAnimationFrame(animate);

      /* ---------- distribuire ---------- */
      $('shareBtn').addEventListener('click', async () => {
        const text = `Am obținut ${fmt(r.dl)} Mbps descărcare / ${fmt(r.ul)} Mbps încărcare la testul de pe serv.ro`;
        if (navigator.share) {
          try { await navigator.share({ title: 'Test viteză serv.ro', text, url: pageUrl }); } catch (e) { /* anulat de utilizator */ }
          return;
        }
        window.open(
          `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`,
          '_blank', 'noopener,width=600,height=520'
        );
      });
    })();
  </script>
