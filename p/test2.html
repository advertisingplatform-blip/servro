<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test viteză internet - speed test</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📶</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #52d5e7;
    --ink: #1a1d21;
    --muted: #8a949c;
    --track: #e7eaed;
    --bg: #ffffff;
    --surface: #f7f9fa;
    --border: #edf0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --primary:#52d5e7; --ink:#1a1d21; --muted:#8a949c; --track:#e7eaed; --bg:#ffffff; --surface:#f7f9fa; --border:#edf0f2; }
  }
  :root[data-theme="dark"] { --primary:#52d5e7; --ink:#1a1d21; --muted:#8a949c; --track:#e7eaed; --bg:#ffffff; --surface:#f7f9fa; --border:#edf0f2; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Montserrat", sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---- nav (mirrors serv.ro) ---- */
  .site-nav {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 14px;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
  .brand img { height: 34px; width: 34px; border-radius: 8px; }
  .brand span { font-weight: 700; font-size: 17px; }
  .nav-links { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .nav-links a { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px; opacity: 0.75; }
  .nav-links a:hover { opacity: 1; color: var(--primary); }
  .nav-cta {
    background: var(--primary); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 14px; padding: 9px 18px; border-radius: 8px;
  }

  main { max-width: 900px; margin: 0 auto; padding: 34px 20px 10px; }

  h1.page-title { font-size: 26px; font-weight: 700; text-align: center; margin: 0 0 28px; color: var(--primary); }

  /* ---- hero: gauge + metrics ---- */
  .test-hero { display: flex; gap: 36px; align-items: center; justify-content: center; flex-wrap: wrap; }

  .gauge-col { position: relative; width: 300px; flex-shrink: 0; }
  .gauge-readout { position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; }
  .gauge-readout .num { font-size: 40px; font-weight: 400; line-height: 1; }
  .gauge-readout .unit { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .gauge-track { fill: none; stroke: var(--track); stroke-width: 16; }
  .gauge-progress { fill: none; stroke: var(--primary); stroke-width: 16; transition: d 0.4s ease; }
  .gauge-needle { stroke: #33383d; stroke-width: 4; stroke-linecap: round; transition: x2 0.5s cubic-bezier(.34,1.4,.64,1), y2 0.5s cubic-bezier(.34,1.4,.64,1); }
  .gauge-hub { fill: #33383d; }
  .gauge-tick-label { font-family: "Montserrat", sans-serif; font-size: 13px; fill: var(--muted); text-anchor: middle; dominant-baseline: middle; }

  .metrics-col { display: flex; flex-direction: column; gap: 22px; min-width: 240px; }
  .mini-stats { display: flex; gap: 30px; }
  .mini-stats .tile .lab { display: flex; align-items: center; gap: 6px; }
  .tile .lab { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  .tile .val { font-size: 30px; font-weight: 400; line-height: 1; }
  .tile .unit { font-size: 13px; color: var(--muted); }
  .chart-stats { display: flex; gap: 16px; }
  .chart-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; flex: 1; min-width: 130px; }
  .chart-tile svg { display: block; margin-top: 6px; width: 100%; height: 34px; }
  .chart-tile path { fill: var(--primary); opacity: 0.85; }

  button#go {
    display: block; margin: 30px auto 8px;
    font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 16px;
    color: #fff; background: var(--primary); border: none; border-radius: 999px;
    padding: 14px 36px; cursor: pointer; transition: transform .15s ease, opacity .15s ease;
  }
  button#go:hover { transform: translateY(-1px); }
  button#go:disabled { opacity: .55; cursor: default; transform: none; }
  button#go:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

  .status { text-align: center; font-size: 13px; color: var(--muted); height: 18px; margin-bottom: 4px; }

  .info-bar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    border-top: 1px solid var(--border); margin-top: 26px; padding-top: 16px; font-size: 13px; color: var(--muted);
  }
  .info-bar .isp { font-weight: 600; color: var(--ink); }
  .info-progress { flex: 1; min-width: 120px; height: 3px; background: var(--track); border-radius: 2px; margin: 0 14px; overflow: hidden; }
  .info-progress i { display: block; height: 100%; width: 0%; background: var(--primary); transition: width .3s ease; }

  .share-row { display: none; gap: 10px; margin-top: 18px; justify-content: center; }
  .share-row button {
    font-family: "Montserrat", sans-serif; font-weight: 500; font-size: 14px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 10px 18px; cursor: pointer;
  }
  .share-row button.fb { color: #fff; background: var(--primary); border-color: var(--primary); }
  .share-note { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center; }

  .history { margin-top: 30px; border-top: 1px solid var(--border); padding-top: 14px; }
  .history h2 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; }
  .history ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .history li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .h-date { color: var(--muted); flex-shrink: 0; }
  .h-isp { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .h-icon { color: var(--muted); flex-shrink: 0; display: flex; }
  .h-vals { margin-left: auto; flex-shrink: 0; font-weight: 500; }

  footer.site-footer { text-align: center; padding: 24px 20px 40px; font-size: 13px; color: var(--muted); }

  @media (max-width: 640px) {
    .nav-links { order: 3; width: 100%; justify-content: center; }
    .test-hero { flex-direction: column; }
    .chart-stats { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gauge-needle, .gauge-progress { transition: none; }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <a class="brand" href="index.html">
    <img src="img/favicon.png" alt="Serv.ro">
    <span>Test viteză internet</span>
  </a>
  <div class="nav-links">
    <a href="p/rcs-rds.html">Digi</a>
    <a href="p/orange.html">Orange</a>
    <a href="p/telekom.html">Telekom</a>
    <a href="p/vodafone.html">Vodafone</a>
  </div>
  <a class="nav-cta" href="index.html">Mobile</a>
</nav>

<main>
  <div class="status" id="status">Apasă start pentru a testa conexiunea</div>

  <div class="test-hero">
    <div class="gauge-col">
      <svg id="gaugeSvg" viewBox="0 0 300 300" width="100%">
        <path class="gauge-track" id="gaugeTrackPath" d=""/>
        <path class="gauge-progress" id="gaugeProgress" d=""/>
        <g id="gaugeTicks"></g>
        <line class="gauge-needle" id="gaugeNeedle" x1="150" y1="150" x2="150" y2="150"/>
        <circle class="gauge-hub" cx="150" cy="150" r="9"/>
      </svg>
      <div class="gauge-readout">
        <div class="num" id="mainNum">0.0</div>
        <div class="unit" id="mainLabel">Mbps &middot; Descărcare</div>
      </div>
    </div>

    <div class="metrics-col">
      <div class="mini-stats">
        <div class="tile">
          <div class="lab">Ping</div>
          <div><span class="val" id="pingVal">—</span> <span class="unit">ms</span></div>
        </div>
        <div class="tile">
          <div class="lab">Jitter</div>
          <div><span class="val" id="jitterVal">—</span> <span class="unit">ms</span></div>
        </div>
      </div>
      <div class="chart-stats">
        <div class="chart-tile">
          <div class="lab">↓ Download</div>
          <div><span class="val" id="downVal">—</span> <span class="unit">Mbps</span></div>
          <svg viewBox="0 0 110 34"><path id="downSpark" d=""/></svg>
        </div>
        <div class="chart-tile">
          <div class="lab">↑ Upload</div>
          <div><span class="val" id="upVal">—</span> <span class="unit">Mbps</span></div>
          <svg viewBox="0 0 110 34"><path id="upSpark" d=""/></svg>
        </div>
      </div>
    </div>
  </div>

  <button id="go">Pornește testul</button>

  <div class="share-row" id="shareRow">
    <button id="shareBtn" class="fb">Distribuie rezultatul</button>
    <button id="downloadBtn">Descarcă imaginea</button>
  </div>
  <div class="share-note" id="shareNote"></div>

  <div class="info-bar">
    <span class="isp" id="ispLabel">—</span>
    <div class="info-progress"><i id="progressBar"></i></div>
    <span>Testat prin Cloudflare Network</span>
  </div>

  <div class="history" id="historyBox" style="display:none;">
    <h2>Ultimele teste</h2>
    <ul id="historyList"></ul>
  </div>
</main>

<footer class="site-footer">&copy; 2026 serv.ro. Toate drepturile rezervate.</footer>

<script type="module">
  import SpeedTest from "https://cdn.jsdelivr.net/npm/@cloudflare/speedtest@1.3.0/+esm";

  const statusEl = document.getElementById('status');
  const mainNum = document.getElementById('mainNum');
  const mainLabel = document.getElementById('mainLabel');
  const downVal = document.getElementById('downVal');
  const upVal = document.getElementById('upVal');
  const pingVal = document.getElementById('pingVal');
  const jitterVal = document.getElementById('jitterVal');
  const goBtn = document.getElementById('go');
  const shareRow = document.getElementById('shareRow');
  const shareBtn = document.getElementById('shareBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const shareNote = document.getElementById('shareNote');
  const historyBox = document.getElementById('historyBox');
  const historyList = document.getElementById('historyList');
  const ispLabel = document.getElementById('ispLabel');
  const progressBar = document.getElementById('progressBar');
  const downSpark = document.getElementById('downSpark');
  const upSpark = document.getElementById('upSpark');

  let lastResult = null;
  let netInfo = { isp: null, type: null };
  let downSamples = [], upSamples = [];

  /* ---------- network / ISP detection ---------- */
  function detectNetworkType() {
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn && conn.type) netInfo.type = conn.type;
  }
  async function detectIsp() {
    try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      if (data && data.org) { netInfo.isp = data.org; ispLabel.textContent = data.org; }
    } catch (e) { console.warn('[servro] ISP lookup failed:', e); }
  }
  async function detectNetworkClass() {
    if (netInfo.type) return;
    try {
      const res = await fetch('https://api.ipapi.is/');
      const data = await res.json();
      const hay = `${data.company || ''} ${data.asn || ''}`.toLowerCase();
      netInfo.type = /mobile|wireless|cellular/.test(hay) ? 'cellular' : 'wifi';
    } catch (e) { console.warn('[servro] network-class lookup failed:', e); }
  }
  detectNetworkType(); detectIsp(); detectNetworkClass();

  const ICON_WIFI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a17 17 0 0 1 20 0"/><path d="M5.5 12.5a12 12 0 0 1 13 0"/><path d="M9 16.5a6.5 6.5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>';
  const ICON_CELL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="14" width="3" height="6"/><rect x="8.5" y="10" width="3" height="10"/><rect x="14" y="6" width="3" height="14"/><rect x="19.5" y="2" width="3" height="18"/></svg>';
  function networkIcon(type) {
    if (type === 'cellular') return ICON_CELL;
    if (type === 'wifi' || type === 'ethernet' || type === 'other' || type === 'wimax') return ICON_WIFI;
    return '';
  }

  /* ---------- history (localStorage) ---------- */
  function loadHistory() {
    try { const raw = localStorage.getItem('servro_speedtest_history'); return raw ? JSON.parse(raw) : []; }
    catch { return []; }
  }
  function saveHistory(entry) {
    try {
      const list = loadHistory();
      list.unshift(entry);
      localStorage.setItem('servro_speedtest_history', JSON.stringify(list.slice(0, 5)));
    } catch {}
  }
  function renderHistory() {
    const list = loadHistory();
    if (!list.length) return;
    historyBox.style.display = 'block';
    historyList.innerHTML = list.map(e => {
      const icon = networkIcon(e.netType);
      const isp = e.isp ? `<span class="h-isp">${e.isp}</span>` : '';
      return `<li>
        <span class="h-date">${e.date}</span>
        ${isp}
        ${icon ? `<span class="h-icon">${icon}</span>` : ''}
        <span class="h-vals">↓ ${e.down} · ↑ ${e.up} Mbps</span>
      </li>`;
    }).join('');
  }

  /* ---------- gauge geometry ---------- */
  const CX = 150, CY = 150, R_TRACK = 120, R_NEEDLE = 96, R_LABEL = 145;
  const START_DEG = 225, END_DEG = -45, SWEEP = 270;
  const TICKS = [0, 10, 25, 50, 100, 150, 200, 350, 500];
  const SCALE_TIERS = [1, 2, 5, 10, 20, 50, 100];
  let scale = 1;

  function polar(deg, r) {
    const rad = deg * Math.PI / 180;
    return { x: CX + r * Math.cos(rad), y: CY - r * Math.sin(rad) };
  }
  function arcPath(d1, d2, r) {
    const p0 = polar(d1, r), p1 = polar(d2, r);
    const large = Math.abs(d1 - d2) > 180 ? 1 : 0;
    return `M${p0.x.toFixed(1)},${p0.y.toFixed(1)} A${r},${r} 0 ${large} 1 ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
  }
  function angleFor(v) {
    const tier = SCALE_TIERS.find(s => v < 500 * s * 0.85) || SCALE_TIERS.at(-1);
    if (tier > scale) { scale = tier; renderTicks(); }
    const ticks = TICKS.map(x => x * scale);
    if (v <= 0) return START_DEG;
    if (v >= ticks.at(-1)) return END_DEG;
    for (let i = 0; i < ticks.length - 1; i++) {
      if (v >= ticks[i] && v < ticks[i + 1]) {
        const frac = (v - ticks[i]) / (ticks[i + 1] - ticks[i]);
        return START_DEG - (i + frac) * (SWEEP / (ticks.length - 1));
      }
    }
    return END_DEG;
  }
  function renderTicks() {
    const g = document.getElementById('gaugeTicks');
    g.innerHTML = '';
    const step = SWEEP / (TICKS.length - 1);
    TICKS.forEach((t, i) => {
      const deg = START_DEG - i * step;
      const p = polar(deg, R_LABEL);
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      el.setAttribute('x', p.x.toFixed(1));
      el.setAttribute('y', p.y.toFixed(1));
      el.setAttribute('class', 'gauge-tick-label');
      el.textContent = t * scale;
      g.appendChild(el);
    });
  }
  document.getElementById('gaugeTrackPath').setAttribute('d', arcPath(START_DEG, END_DEG, R_TRACK));
  renderTicks();

  function setGauge(value) {
    const deg = angleFor(value);
    const tip = polar(deg, R_NEEDLE);
    document.getElementById('gaugeNeedle').setAttribute('x2', tip.x.toFixed(1));
    document.getElementById('gaugeNeedle').setAttribute('y2', tip.y.toFixed(1));
    document.getElementById('gaugeProgress').setAttribute('d', arcPath(START_DEG, deg, R_TRACK));
  }
  function resetGauge() {
    scale = 1;
    renderTicks();
    document.getElementById('gaugeProgress').setAttribute('d', arcPath(START_DEG, START_DEG, R_TRACK));
    const tip = polar(START_DEG, R_NEEDLE);
    document.getElementById('gaugeNeedle').setAttribute('x2', tip.x.toFixed(1));
    document.getElementById('gaugeNeedle').setAttribute('y2', tip.y.toFixed(1));
  }

  function sparkPath(samples, w, h) {
    if (!samples.length) return '';
    const max = Math.max(...samples, 1);
    const step = w / Math.max(samples.length - 1, 1);
    let d = `M0,${h}`;
    samples.forEach((s, i) => { d += ` L${(i * step).toFixed(1)},${(h - (s / max) * h * 0.9).toFixed(1)}`; });
    d += ` L${w},${h} Z`;
    return d;
  }

  function mbps(bps) { return bps ? (bps / 1e6).toFixed(1) : '0.0'; }

  /* ---------- result-image (canvas) for sharing ---------- */
  async function buildResultImage(down, up, lat) {
    await document.fonts.ready;
    const c = document.createElement('canvas');
    c.width = 1200; c.height = 630;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 1200, 630);
    ctx.fillStyle = '#52d5e7';
    ctx.font = '700 34px "Montserrat"';
    ctx.fillText('serv.ro', 90, 90);
    ctx.font = '400 190px "Montserrat"';
    ctx.fillStyle = '#1a1d21';
    ctx.fillText(down, 90, 380);
    const w = ctx.measureText(down).width;
    ctx.font = '400 40px "Montserrat"';
    ctx.fillStyle = '#8a949c';
    ctx.fillText('Mbps', 110 + w, 380);
    ctx.font = '500 30px "Montserrat"';
    ctx.fillText('Viteză descărcare', 92, 430);
    const stats = [['Încărcare', up + ' Mbps'], ['Ping', lat + ' ms']];
    stats.forEach(([lab, val], i) => {
      const x = 92 + i * 400;
      ctx.fillStyle = '#f7f9fa'; ctx.strokeStyle = '#edf0f2';
      ctx.beginPath(); ctx.roundRect(x, 480, 360, 100, 14); ctx.fill(); ctx.stroke();
      ctx.font = '600 34px "Montserrat"'; ctx.fillStyle = '#1a1d21';
      ctx.fillText(val, x + 24, 528);
      ctx.font = '400 20px "Montserrat"'; ctx.fillStyle = '#8a949c';
      ctx.fillText(lab, x + 24, 560);
    });
    ctx.font = '400 22px "Montserrat"'; ctx.fillStyle = '#8a949c';
    ctx.fillText('Testează-ți și tu conexiunea pe serv.ro', 92, 600);
    return new Promise(resolve => c.toBlob(resolve, 'image/png'));
  }

  downloadBtn.addEventListener('click', async () => {
    if (!lastResult) return;
    const blob = await buildResultImage(lastResult.down, lastResult.up, lastResult.lat);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'test-viteza-servro.png'; a.click();
  });
  shareBtn.addEventListener('click', async () => {
    if (!lastResult) return;
    const { down, up, lat } = lastResult;
    const text = `Am obținut ${down} Mbps descărcare / ${up} Mbps încărcare la testul de pe serv.ro`;
    const blob = await buildResultImage(down, up, lat);
    const file = new File([blob], 'test-viteza-servro.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Test viteză serv.ro', text }); return; } catch { return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'test-viteza-servro.png'; a.click();
    shareNote.textContent = 'Imaginea s-a descărcat — atașeaz-o manual la postarea de Facebook care se deschide acum.';
    const url = encodeURIComponent(location.href.split('?')[0]);
    const quote = encodeURIComponent(text);
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${quote}`, '_blank', 'noopener,width=600,height=520');
  });

  /* ---------- test run ---------- */
  const measurements = [
    { type: 'latency', numPackets: 1 },
    { type: 'download', bytes: 1e5, count: 1, bypassMinDuration: true },
    { type: 'latency', numPackets: 20 },
    { type: 'download', bytes: 1e5, count: 9 },
    { type: 'download', bytes: 1e6, count: 8 },
    { type: 'upload', bytes: 1e5, count: 8 },
    { type: 'upload', bytes: 1e6, count: 6 },
    { type: 'download', bytes: 1e7, count: 6 },
    { type: 'upload', bytes: 1e7, count: 4 },
    { type: 'download', bytes: 2.5e7, count: 4 },
    { type: 'upload', bytes: 2.5e7, count: 4 },
    { type: 'download', bytes: 1e8, count: 3 },
    { type: 'upload', bytes: 5e7, count: 3 },
    { type: 'download', bytes: 2.5e8, count: 2 }
  ];
  const totalSteps = measurements.length;
  let stepCount = 0;

  function runTest() {
    goBtn.disabled = true; goBtn.textContent = 'Se testează…';
    resetGauge();
    downSamples = []; upSamples = []; stepCount = 0;
    downSpark.setAttribute('d', ''); upSpark.setAttribute('d', '');
    mainLabel.textContent = 'Mbps · Latență';
    statusEl.textContent = 'Se măsoară latența conexiunii…';
    downVal.textContent = '—'; upVal.textContent = '—'; pingVal.textContent = '—'; jitterVal.textContent = '—';
    progressBar.style.width = '0%';

    const test = new SpeedTest({ autoStart: false, measurements });

    test.onResultsChange = ({ type }) => {
      stepCount++;
      progressBar.style.width = Math.min(100, (stepCount / totalSteps) * 100) + '%';
      if (type === 'latency') {
        const lat = test.results.getUnloadedLatency();
        const jit = test.results.getUnloadedJitter ? test.results.getUnloadedJitter() : null;
        if (lat) pingVal.textContent = Math.round(lat);
        if (jit) jitterVal.textContent = Math.round(jit);
      }
      if (type === 'download') {
        mainLabel.textContent = 'Mbps · Descărcare';
        statusEl.textContent = 'Se testează viteza de descărcare…';
        const bw = test.results.getDownloadBandwidth();
        if (bw) {
          const v = parseFloat(mbps(bw));
          mainNum.textContent = v.toFixed(1); downVal.textContent = v.toFixed(1);
          setGauge(v);
          downSamples.push(v); downSpark.setAttribute('d', sparkPath(downSamples, 110, 34));
        }
      }
      if (type === 'upload') {
        mainLabel.textContent = 'Mbps · Încărcare';
        statusEl.textContent = 'Se testează viteza de încărcare…';
        const bw = test.results.getUploadBandwidth();
        if (bw) {
          const v = parseFloat(mbps(bw));
          mainNum.textContent = v.toFixed(1); upVal.textContent = v.toFixed(1);
          setGauge(v);
          upSamples.push(v); upSpark.setAttribute('d', sparkPath(upSamples, 110, 34));
        }
      }
    };

    test.onFinish = (results) => {
      const down = mbps(results.getDownloadBandwidth());
      const up = mbps(results.getUploadBandwidth());
      const lat = Math.round(results.getUnloadedLatency() || 0);
      downVal.textContent = down; upVal.textContent = up; pingVal.textContent = lat;
      mainNum.textContent = up; mainLabel.textContent = 'Mbps · Încărcare';
      setGauge(parseFloat(up));
      statusEl.textContent = 'Test finalizat';
      goBtn.disabled = false; goBtn.textContent = 'Testează din nou';
      progressBar.style.width = '100%';

      saveHistory({
        date: new Date().toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit' }) + ' ' +
              new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' }),
        down, up, isp: netInfo.isp, netType: netInfo.type
      });
      renderHistory();

      lastResult = { down, up, lat };
      shareRow.style.display = 'flex';
      shareNote.textContent = '';
    };

    test.onError = () => {
      statusEl.textContent = 'A apărut o eroare, încearcă din nou.';
      resetGauge();
      goBtn.disabled = false; goBtn.textContent = 'Testează din nou';
    };

    test.play();
  }

  goBtn.addEventListener('click', runTest);
  renderHistory();
</script>

</body>
</html>
