  <!-- Stiluri vitezometru (folosesc paleta și fontul paginii) -->
  <style>
    .speedtest-widget {
      --st-primary: var(--primary-color, #002bff);
      --st-dl: var(--st-primary);   /* culoarea inelului de download */
      --st-ul: #ff7a00;             /* culoarea inelului de upload */
      --st-ink: #1a1d21;
      --st-muted: #7d8590;
      --st-track: #e7eaed;
      --st-surface: #f2f4f6;
      --st-border: #edf0f2;
      font-family: "Inter Tight", sans-serif;
      color: var(--st-ink);
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 24px 18px;
      max-width: 780px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .speedtest-widget * { box-sizing: border-box; }
    .speedtest-widget .status { text-align: center; font-size: 13px; color: var(--st-muted); height: 18px; margin-bottom: 8px; }

    .speedtest-widget .test-hero { display: flex; gap: 32px; align-items: center; justify-content: center; flex-wrap: wrap; }

    /* ---- vitezometru: două inele concentrice ---- */
    .speedtest-widget .gauge-col { position: relative; width: 290px; max-width: 100%; flex-shrink: 0; }
    .speedtest-widget .gauge-col svg { display: block; }
    .speedtest-widget .gauge-track { fill: none; stroke: var(--st-track); stroke-width: 16; stroke-linecap: round; }
    .speedtest-widget .gauge-progress { fill: none; stroke-width: 16; stroke-linecap: round; }
    .speedtest-widget .gauge-progress.dl { stroke: var(--st-dl); }
    .speedtest-widget .gauge-progress.ul { stroke: var(--st-ul); }
    .speedtest-widget .gauge-dot { fill: #ffffff; stroke-width: 4; }
    .speedtest-widget .gauge-dot.dl { stroke: var(--st-dl); }
    .speedtest-widget .gauge-dot.ul { stroke: var(--st-ul); }
    .speedtest-widget .gauge-tick-label { font-family: "Inter Tight", sans-serif; font-size: 12px; fill: var(--st-muted); text-anchor: middle; dominant-baseline: middle; }

    .speedtest-widget .gauge-readout { position: absolute; left: 0; right: 0; top: 58.8%; transform: translateY(-50%); text-align: center; pointer-events: none; }
    .speedtest-widget .ro-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .speedtest-widget .ro-row .arrow { font-size: 16px; font-weight: 700; }
    .speedtest-widget .ro-row.dl .arrow { color: var(--st-dl); }
    .speedtest-widget .ro-row.ul .arrow { color: var(--st-ul); }
    .speedtest-widget .ro-row .num { font-weight: 400; }
    .speedtest-widget .ro-row.active .num { font-weight: 700; }
    .speedtest-widget .ro-unit { font-size: 12px; color: var(--st-muted); margin-top: 2px; }

    /* ---- panouri download / upload / ping ---- */
    .speedtest-widget .metrics-col { display: flex; flex-direction: column; gap: 12px; flex: 1 1 300px; max-width: 390px; min-width: 260px; }
    .speedtest-widget .m-tile { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--st-surface); border-radius: 10px; padding: 12px 16px; }
    .speedtest-widget .m-tile.m-pj { justify-content: space-around; padding: 14px 16px; }
    .speedtest-widget .m-lab { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
    .speedtest-widget .m-lab i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--st-muted); }
    .speedtest-widget .m-lab.dl i { background: var(--st-dl); }
    .speedtest-widget .m-lab.ul i { background: var(--st-ul); }
    .speedtest-widget .m-val { font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .speedtest-widget .m-unit { font-size: 12px; color: var(--st-muted); }
    .speedtest-widget .m-chart { width: 150px; height: 56px; flex-shrink: 0; display: block; }

    .speedtest-widget button#go {
      display: block; margin: 26px auto 8px;
      font-family: "Inter Tight", sans-serif; font-weight: 700; font-size: 15px;
      color: #fff; background: var(--st-primary); border: none; border-radius: 999px;
      padding: 13px 32px; cursor: pointer; transition: transform .15s ease, opacity .15s ease;
    }
    .speedtest-widget button#go:hover { transform: translateY(-1px); }
    .speedtest-widget button#go:disabled { opacity: .55; cursor: default; transform: none; }
    .speedtest-widget button#go:focus-visible { outline: 2px solid var(--st-primary); outline-offset: 3px; }

    .speedtest-widget .info-bar {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      border-top: 1px solid var(--st-border); margin-top: 22px; padding-top: 14px; font-size: 12px; color: var(--st-muted);
    }
    .speedtest-widget .info-bar .isp { font-weight: 700; color: var(--st-ink); }
    .speedtest-widget .isp-block { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .speedtest-widget .info-bar .ip { font-size: 11px; color: var(--st-muted); font-variant-numeric: tabular-nums; word-break: break-all; }
    .speedtest-widget .info-progress { flex: 1; min-width: 120px; height: 3px; background: var(--st-track); border-radius: 2px; margin: 0 14px; overflow: hidden; }
    .speedtest-widget .info-progress i { display: block; height: 100%; width: 0%; background: var(--st-primary); transition: width .3s ease; }

    .speedtest-widget .share-row { display: none; gap: 10px; margin-top: 16px; justify-content: center; }
    .speedtest-widget .share-row button {
      font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 13px; color: var(--st-ink);

    .speedtest-widget .share-row button.fb { color: #fff; background: var(--st-primary); border-color: var(--st-primary); }
    .speedtest-widget .share-note { font-size: 11px; color: var(--st-muted); margin-top: 8px; text-align: center; }

    .speedtest-widget .history { margin-top: 26px; border-top: 1px solid var(--st-border); padding-top: 12px; }
    .speedtest-widget .history h2 { font-size: 12px; font-weight: 700; color: var(--st-muted); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; }
    .speedtest-widget .history ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .speedtest-widget .history li { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .speedtest-widget .h-date { color: var(--st-muted); flex-shrink: 0; }
    .speedtest-widget .h-isp { color: var(--st-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .speedtest-widget .h-icon { color: var(--st-muted); flex-shrink: 0; display: flex; }
    .speedtest-widget .h-vals { margin-left: auto; flex-shrink: 0; font-weight: 600; }

    @media (max-width: 640px) {
      .speedtest-widget .test-hero { flex-direction: column; }
      .speedtest-widget .metrics-col { width: 100%; max-width: none; flex-basis: auto; }
    }

  <!-- Logica vitezometrului (adaptată din instrumentul Cloudflare speed test) -->
  <script type="module">
    import SpeedTest from "https://cdn.jsdelivr.net/npm/@cloudflare/speedtest@1.3.0/+esm";

    const statusEl = document.getElementById('status');
    const numDl = document.getElementById('numDl');
    const numUl = document.getElementById('numUl');
    const roDl = document.getElementById('roDl');
    const roUl = document.getElementById('roUl');
    const downVal = document.getElementById('downVal');
    const upVal = document.getElementById('upVal');
    const pingVal = document.getElementById('pingVal');
    const jitterVal = document.getElementById('jitterVal');
    const goBtn = document.getElementById('go');
    const shareRow = document.getElementById('shareRow');
    const shareBtn = document.getElementById('shareBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const shareNote = document.getElementById('shareNote');
    const historyBox = document.getElementById('historyBox');
    const historyList = document.getElementById('historyList');
    const ispLabel = document.getElementById('ispLabel');
    const ipLabel = document.getElementById('ipLabel');
    const progressBar = document.getElementById('progressBar');
    const downSpark = document.getElementById('downSpark');
    const upSpark = document.getElementById('upSpark');

    let lastResult = null;
    let netInfo = { isp: null, ip: null, type: null };
    let downSamples = [], upSamples = [];

    /* ---------- network / ISP detection ---------- */
    function detectNetworkType() {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (conn && conn.type) netInfo.type = conn.type;
    }
    function showIsp(isp, ip) {
      if (isp) { netInfo.isp = isp; ispLabel.textContent = isp; }
      if (ip) { netInfo.ip = ip; ipLabel.textContent = ip; }
    }
    async function detectIsp() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        showIsp(data && data.org, data && data.ip);
        if (netInfo.isp && netInfo.ip) return;
      } catch (e) { console.warn('[servro] ISP lookup failed:', e); }
      // rezervă: alt serviciu, dacă primul a eșuat sau nu a returnat tot
      try {
        const res = await fetch('https://api.ipapi.is/');
        const data = await res.json();
        showIsp(
          !netInfo.isp && ((data.company && data.company.name) || (data.asn && data.asn.org)),
          !netInfo.ip && data.ip
        );
      } catch (e) { console.warn('[servro] ISP fallback failed:', e); }
    }
    async function detectNetworkClass() {
      if (netInfo.type) return;
      try {
        const res = await fetch('https://api.ipapi.is/');
        const data = await res.json();
        const hay = `${data.company || ''} ${data.asn || ''}`.toLowerCase();
        netInfo.type = /mobile|wireless|cellular/.test(hay) ? 'cellular' : 'wifi';
      } catch (e) { console.warn('[servro] network-class lookup failed:', e); }
    }
    detectNetworkType(); detectIsp(); detectNetworkClass();

    const ICON_WIFI = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a17 17 0 0 1 20 0"/><path d="M5.5 12.5a12 12 0 0 1 13 0"/><path d="M9 16.5a6.5 6.5 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>';
    const ICON_CELL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="14" width="3" height="6"/><rect x="8.5" y="10" width="3" height="10"/><rect x="14" y="6" width="3" height="14"/><rect x="19.5" y="2" width="3" height="18"/></svg>';
    function networkIcon(type) {
      if (type === 'cellular') return ICON_CELL;
      if (type === 'wifi' || type === 'ethernet' || type === 'other' || type === 'wimax') return ICON_WIFI;
      return '';
    }

    /* ---------- history (localStorage) ---------- */
    function loadHistory() {
      try { const raw = localStorage.getItem('servro_speedtest_history'); return raw ? JSON.parse(raw) : []; }
      catch { return []; }
    }
    function saveHistory(entry) {
      try {
        const list = loadHistory();
        list.unshift(entry);
        localStorage.setItem('servro_speedtest_history', JSON.stringify(list.slice(0, 5)));
      } catch {}
    }
    function renderHistory() {
      const list = loadHistory();
      if (!list.length) return;
      historyBox.style.display = 'block';
      historyList.innerHTML = list.map(e => {
        const icon = networkIcon(e.netType);
        const isp = e.isp ? `<span class="h-isp">${e.isp}</span>` : '';
        return `<li>
          <span class="h-date">${e.date}</span>
          ${isp}
          ${icon ? `<span class="h-icon">${icon}</span>` : ''}
          <span class="h-vals">↓ ${e.down} · ↑ ${e.up} Mbps</span>
        </li>`;
      }).join('');
    }

    /* ---------- vitezometru: două inele concentrice (download = exterior, upload = interior) ---------- */
    const CX = 150, CY = 150, R_LABEL = 142;
    const START_DEG = 225, SWEEP = 270;
    // Scala din designul de referință: poziții egale pe cadran, interpolare liniară între ele
    const TICKS = [0, 0.5, 1, 10, 100, 500, 1000];
    const TICK_LABELS = ['0', '0.5', '1', '10', '100', '500', '1000+'];
    const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const rings = {
      dl: { r: 118, cur: 0, target: 0, track: document.getElementById('trackDl'), prog: document.getElementById('progDl'), dot: document.getElementById('dotDl') },
      ul: { r: 92,  cur: 0, target: 0, track: document.getElementById('trackUl'), prog: document.getElementById('progUl'), dot: document.getElementById('dotUl') }
    };

    function polar(deg, r) {
      const rad = deg * Math.PI / 180;
      return { x: CX + r * Math.cos(rad), y: CY - r * Math.sin(rad) };
    }
    function arcPath(d1, d2, r) {
      const p0 = polar(d1, r), p1 = polar(d2, r);
      const large = Math.abs(d1 - d2) > 180 ? 1 : 0;
      return `M${p0.x.toFixed(1)},${p0.y.toFixed(1)} A${r},${r} 0 ${large} 1 ${p1.x.toFixed(1)},${p1.y.toFixed(1)}`;
    }
    // viteză (Mbps) -> poziție pe cadran, 0..1
    function fractionFor(v) {
      if (!(v > 0)) return 0;
      const last = TICKS.length - 1;
      if (v >= TICKS[last]) return 1;
      for (let i = 0; i < last; i++) {
        if (v < TICKS[i + 1]) return (i + (v - TICKS[i]) / (TICKS[i + 1] - TICKS[i])) / last;
      }
      return 1;
    }
    function renderTicks() {
      const g = document.getElementById('gaugeTicks');
      g.innerHTML = '';
      const step = SWEEP / (TICKS.length - 1);
      TICK_LABELS.forEach((label, i) => {
        const p = polar(START_DEG - i * step, R_LABEL);
        const el = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        el.setAttribute('x', p.x.toFixed(1));
        el.setAttribute('y', p.y.toFixed(1));
        el.setAttribute('class', 'gauge-tick-label');
        el.textContent = label;
        g.appendChild(el);
      });
    }
    function drawRing(k) {
      const g = rings[k];
      const deg = START_DEG - g.cur * SWEEP;
      g.prog.setAttribute('d', g.cur > 0.002 ? arcPath(START_DEG, deg, g.r) : '');
      const p = polar(deg, g.r);
      g.dot.setAttribute('cx', p.x.toFixed(1));
      g.dot.setAttribute('cy', p.y.toFixed(1));
    }

    // animație lină: punctul alunecă spre valoarea țintă
    let raf = null;
    function animate() {
      let moving = false;
      for (const k in rings) {
        const g = rings[k];
        const diff = g.target - g.cur;
        if (Math.abs(diff) > 0.0005) { g.cur += diff * 0.14; moving = true; } else { g.cur = g.target; }
        drawRing(k);
      }
      raf = moving ? requestAnimationFrame(animate) : null;
    }
    function setRing(k, v) {
      rings[k].target = fractionFor(v);
      if (REDUCE_MOTION) { rings[k].cur = rings[k].target; drawRing(k); return; }
      if (!raf) raf = requestAnimationFrame(animate);
    }
    function resetGauge() {
      for (const k in rings) { rings[k].cur = 0; rings[k].target = 0; drawRing(k); }
    }
    function setActive(k) {
      roDl.classList.toggle('active', k === 'dl');
      roUl.classList.toggle('active', k === 'ul');
    }

    for (const k in rings) {
      rings[k].track.setAttribute('d', arcPath(START_DEG, START_DEG - SWEEP, rings[k].r));
      drawRing(k);
    }
    renderTicks();

    /* ---------- grafice download / upload (arie netezită) ---------- */
    const SPARK_W = 110, SPARK_H = 50;
    function sparkPath(samples, w, h) {
      if (!samples.length) return '';
      if (samples.length === 1) samples = [samples[0], samples[0]];
      const max = Math.max(...samples, 1);
      const step = w / (samples.length - 1);
      const pts = samples.map((s, i) => [i * step, h - (s / max) * h * 0.9]);
      let d = `M0,${h} L0,${pts[0][1].toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        const cx = ((x0 + x1) / 2).toFixed(1);
        d += ` C${cx},${y0.toFixed(1)} ${cx},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
      }
      d += ` L${w},${h} Z`;
      return d;
    }

    function mbps(bps) { return bps ? (bps / 1e6).toFixed(1) : '0.0'; }

    /* ---------- share / download (imaginea e generată de Cloudflare Worker) ---------- */
    // Viteze rotunjite la întreg: Worker-ul desenează o singură dată fiecare combinație
    function shareParams({ down, up, lat }) {
      return `dl=${Math.round(parseFloat(down))}&ul=${Math.round(parseFloat(up))}&ping=${Math.round(lat)}`;
    }

    downloadBtn.addEventListener('click', async () => {
      if (!lastResult) return;
      try {
        const res = await fetch(`/share/og-image?${shareParams(lastResult)}`);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'test-viteza-digi-servro.png';
        a.click();
      } catch (e) {
        shareNote.textContent = 'Nu am putut genera imaginea, încearcă din nou.';
      }
    });

    shareBtn.addEventListener('click', () => {
      if (!lastResult) return;
      // Facebook va citi og:image de la acest URL (generat dinamic de Worker)
      const shareUrl = `${location.origin}/share/?${shareParams(lastResult)}`;
      window.open(
        `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}`,
        '_blank', 'noopener,width=600,height=520'
      );
    });

    /* ---------- test run ---------- */
    const measurements = [
      { type: 'latency', numPackets: 1 },
      { type: 'download', bytes: 1e5, count: 1, bypassMinDuration: true },
      { type: 'latency', numPackets: 20 },
      { type: 'download', bytes: 1e5, count: 9 },
      { type: 'download', bytes: 1e6, count: 8 },
      { type: 'upload', bytes: 1e5, count: 8 },
      { type: 'upload', bytes: 1e6, count: 6 },
      { type: 'download', bytes: 1e7, count: 6 },
      { type: 'upload', bytes: 1e7, count: 4 },
      { type: 'download', bytes: 2.5e7, count: 4 },
      { type: 'upload', bytes: 2.5e7, count: 4 },
      { type: 'download', bytes: 1e8, count: 3 },
      { type: 'upload', bytes: 5e7, count: 3 },
      { type: 'download', bytes: 2.5e8, count: 2 }
    ];
    const totalSteps = measurements.length;
    let stepCount = 0;

    function runTest() {
      goBtn.disabled = true; goBtn.textContent = 'Se testează…';
      resetGauge();
      setActive(null);
      downSamples = []; upSamples = []; stepCount = 0;
      downSpark.setAttribute('d', ''); upSpark.setAttribute('d', '');
      statusEl.textContent = 'Se măsoară latența conexiunii…';
      downVal.textContent = '—'; upVal.textContent = '—'; pingVal.textContent = '—'; jitterVal.textContent = '—';
      numDl.textContent = '—'; numUl.textContent = '—';
      progressBar.style.width = '0%';
      shareRow.style.display = 'none'; shareNote.textContent = '';

      const test = new SpeedTest({ autoStart: false, measurements });

      test.onResultsChange = ({ type }) => {
        stepCount++;
        progressBar.style.width = Math.min(100, (stepCount / totalSteps) * 100) + '%';
        if (type === 'latency') {
          const lat = test.results.getUnloadedLatency();
          const jit = test.results.getUnloadedJitter ? test.results.getUnloadedJitter() : null;
          if (lat) pingVal.textContent = Math.round(lat);
          if (jit) jitterVal.textContent = Math.round(jit);
        }
        if (type === 'download') {
          setActive('dl');
          statusEl.textContent = 'Se testează viteza de descărcare…';
          const bw = test.results.getDownloadBandwidth();
          if (bw) {
            const v = parseFloat(mbps(bw));
            numDl.textContent = v.toFixed(1); downVal.textContent = v.toFixed(1);
            setRing('dl', v);
            downSamples.push(v); downSpark.setAttribute('d', sparkPath(downSamples, SPARK_W, SPARK_H));
          }
        }
        if (type === 'upload') {
          setActive('ul');
          statusEl.textContent = 'Se testează viteza de încărcare…';
          const bw = test.results.getUploadBandwidth();
          if (bw) {
            const v = parseFloat(mbps(bw));
            numUl.textContent = v.toFixed(1); upVal.textContent = v.toFixed(1);
            setRing('ul', v);
            upSamples.push(v); upSpark.setAttribute('d', sparkPath(upSamples, SPARK_W, SPARK_H));
          }
        }
      };

      test.onFinish = (results) => {
        const down = mbps(results.getDownloadBandwidth());
        const up = mbps(results.getUploadBandwidth());
        const lat = Math.round(results.getUnloadedLatency() || 0);
        downVal.textContent = down; upVal.textContent = up; pingVal.textContent = lat;
        numDl.textContent = down; numUl.textContent = up;
        setRing('dl', parseFloat(down)); setRing('ul', parseFloat(up));
        setActive(null);
        statusEl.textContent = 'Test finalizat';
        goBtn.disabled = false; goBtn.textContent = 'Testează din nou';
        progressBar.style.width = '100%';

        saveHistory({
          date: new Date().toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit' }) + ' ' +
                new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' }),
          down, up, isp: netInfo.isp, netType: netInfo.type
        });
        renderHistory();

        lastResult = { down, up, lat };
        shareRow.style.display = 'flex';
        shareNote.textContent = '';
      };

      test.onError = () => {
        statusEl.textContent = 'A apărut o eroare, încearcă din nou.';
        resetGauge();
        setActive(null);
        goBtn.disabled = false; goBtn.textContent = 'Testează din nou';
      };

      test.play();
    }

    goBtn.addEventListener('click', runTest);
    renderHistory();
  </script>

  <script src="../js/script.min.js" defer></script>
</body>
</html>
